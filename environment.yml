# Environment configuration for conda
# This file may be used to create an environment using:
# $ conda create --name <env> --file <this file>
# platform: osx-64

name: derivatives
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.7
  - numpy>=1.20.0
  - pip
  - pip:
    - pytest>=6.0.0